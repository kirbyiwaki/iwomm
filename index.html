<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>worksOnMyMachine</title>
  <!-- Fun display font + Dracula-friendly UI & code fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <!-- Lightweight Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      /* Dracula Theme Palette */
      --bg: #282a36;
      --bg-elevated: #21222c;
      --card-bg: #313442;
      --card-hover: #383b4d;
      --border: #44475a;
      --fg: #f8f8f2;
      --comment: #8b9bb4;
      --cyan: #8be9fd;
      --green: #50fa7b;
      --orange: #ffb86c;
      --pink: #ff79c6;
      --purple: #bd93f9;
      --red: #ff5555;
      --yellow: #f1fa8c;
      --code-bg: #1e1f29;
      --shadow: 0 8px 24px rgba(15, 16, 23, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header & Fun Parody Logo */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 16px 24px;
      background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 18px;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease;
    }

    .logo:hover {
      transform: scale(1.02);
    }

    /* Dracula-tinted parody colors */
    .c-cyan   { color: var(--cyan); }
    .c-pink   { color: var(--pink); }
    .c-yellow { color: var(--yellow); }
    .c-green  { color: var(--green); }
    .c-purple { color: var(--purple); }
    .c-orange { color: var(--orange); }

    .search-box {
      width: 100%;
      max-width: 620px;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 11px 18px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-box:hover,
    .search-box:focus-within {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(189, 147, 249, 0.2);
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--fg);
      font-family: inherit;
      font-size: 15.5px;
    }

    .search-box input::placeholder {
      color: var(--comment);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--comment);
      font-size: 17px;
      cursor: pointer;
      display: none;
      padding: 0 4px;
    }

    .clear-btn:hover {
      color: var(--red);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .actions button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .actions button:hover {
      background: var(--card-hover);
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    /* Main Container */
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 22px 16px 64px;
    }

    .stats {
      font-size: 13px;
      color: var(--comment);
      margin-bottom: 16px;
    }

    /* Pretty Result Cards */
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--purple);
      border-radius: 12px;
      padding: 16px 20px;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .card:nth-child(4n+2) { border-left-color: var(--cyan); }
    .card:nth-child(4n+3) { border-left-color: var(--green); }
    .card:nth-child(4n+4) { border-left-color: var(--pink); }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--purple);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .card-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--comment);
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--cyan);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 6px;
    }

    .card:hover .card-title {
      text-decoration: underline;
      color: var(--pink);
    }

    .card-snippet {
      font-size: 14px;
      color: var(--fg);
      margin: 0 0 12px;
      overflow-wrap: anywhere;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      background: var(--bg-elevated);
      color: var(--green);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .tag:hover {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    mark {
      background: rgba(241, 140, 241, 0.22);
      color: var(--yellow);
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* Fix Reader View */
    .article-view {
      display: none;
    }

    .back-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--cyan);
      font-family: inherit;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .back-btn:hover {
      background: var(--card-hover);
      border-color: var(--cyan);
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      box-shadow: var(--shadow);
      overflow-wrap: anywhere;
    }

    .article-content h1,
    .article-content h2,
    .article-content h3 {
      color: var(--purple);
      margin-top: 1.4em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    .article-content h1:first-child {
      margin-top: 0;
      font-size: 26px;
      color: var(--fg);
    }

    .article-content h2 {
      font-size: 20px;
      color: var(--cyan);
    }

    .article-content h3 {
      font-size: 16px;
      color: var(--pink);
    }

    .article-content p,
    .article-content li {
      color: var(--fg);
      margin-bottom: 10px;
    }

    .article-content ol,
    .article-content ul {
      padding-left: 22px;
    }

    .article-content a {
      color: var(--cyan);
    }

    .article-content pre {
      background: var(--code-bg);
      padding: 14px 16px;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid var(--border);
      margin: 14px 0;
    }

    .article-content code {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      color: var(--orange);
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .article-content pre code {
      padding: 0;
      background: transparent;
      color: var(--green);
    }

    .empty-state {
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: var(--comment);
    }
  </style>
</head>
<body>

  <header>
    <h1 class="logo" id="logoBtn" title="Reset search">
      <span class="c-cyan">w</span><span class="c-pink">o</span><span class="c-yellow">r</span><span class="c-green">k</span><span class="c-purple">s</span><span class="c-orange">O</span><span class="c-cyan">n</span><span class="c-pink">M</span><span class="c-yellow">y</span><span class="c-green">M</span><span class="c-purple">a</span><span class="c-orange">c</span><span class="c-cyan">h</span><span class="c-pink">i</span><span class="c-yellow">n</span><span class="c-green">e</span>
    </h1>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search Windows fixes, error codes, commands..."
        autocomplete="off"
      />
      <button class="clear-btn" id="clearBtn" title="Clear">✕</button>
    </div>

    <div class="actions">
      <button id="luckyBtn">🎲 I'm Feeling Lucky</button>
      <button id="allBtn">📋 Show All Fixes</button>
    </div>
  </header>

  <main>
    <!-- Search / Index List View -->
    <section id="listView">
      <div class="stats" id="statsText">Loading fixes...</div>
      <div id="resultsContainer" class="results-grid"></div>
    </section>

    <!-- Single Fix Reader View -->
    <section id="articleView" class="article-view">
      <button class="back-btn" id="backBtn">← Back to results</button>
      <div class="article-card">
        <article id="articleContent" class="article-content"></article>
      </div>
    </section>
  </main>

  <script>
    const FIXES_DIR = 'fixes/';
    const MANIFEST_URL = 'manifest.json';

    let allFixes = [];

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const statsText = document.getElementById('statsText');
    const resultsContainer = document.getElementById('resultsContainer');
    const listView = document.getElementById('listView');
    const articleView = document.getElementById('articleView');
    const articleContent = document.getElementById('articleContent');

    // Normalize line endings and strip frontmatter reliably
    function parseMarkdownFile(filename, rawText) {
      const normalized = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
      let title = filename.replace(/\.md$/i, '').replace(/[-_]+/g, ' ');
      let tags = [];
      let body = normalized;

      const fmMatch = normalized.match(/^---\s*\n([\s\S]*?)\n---\s*(?:\n([\s\S]*))?$/);
      if (fmMatch) {
        const frontmatter = fmMatch[1];
        body = (fmMatch[2] || '').trim();

        const titleMatch = frontmatter.match(/^title:\s*(.+)$/m);
        if (titleMatch) title = titleMatch[1].trim().replace(/^["']|["']$/g, '');

        const tagsMatch = frontmatter.match(/^tags:\s*(.+)$/m);
        if (tagsMatch) {
          tags = tagsMatch[1].split(',').map(t => t.trim()).filter(Boolean);
        }
      } else {
        const h1Match = normalized.match(/^#\s+(.+)$/m);
        if (h1Match) title = h1Match[1].trim();
      }

      const plainText = body
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/[#>*_`~\-\[\]()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      return {
        slug: filename.replace(/\.md$/i, ''),
        filename,
        title,
        tags,
        body,
        plainText
      };
    }

    // Render Markdown safely even if CDN marked.js ever fails to load
    function renderMarkdown(mdText) {
      if (window.marked && typeof window.marked.parse === 'function') {
        return window.marked.parse(mdText);
      }
      const escaped = mdText
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      return `<pre>${escaped}</pre>`;
    }

    function buildSnippet(plainText, query) {
      if (!plainText) return 'No preview text available.';
      if (!query) {
        return plainText.slice(0, 165) + (plainText.length > 165 ? '...' : '');
      }
      const lowerText = plainText.toLowerCase();
      const idx = lowerText.indexOf(query.toLowerCase());
      let start = idx > 50 ? idx - 50 : 0;
      let snippet = plainText.slice(start, start + 175);
      if (start > 0) snippet = '...' + snippet;
      if (start + 175 < plainText.length) snippet += '...';

      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return snippet.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }

    function renderResults(query = '') {
      const q = query.trim().toLowerCase();
      clearBtn.style.display = q ? 'block' : 'none';

      const startTime = performance.now();
      const filtered = q
        ? allFixes.filter(fix =>
            fix.title.toLowerCase().includes(q) ||
            fix.plainText.toLowerCase().includes(q) ||
            fix.tags.some(t => t.toLowerCase().includes(q))
          )
        : allFixes;

      const elapsed = ((performance.now() - startTime) / 1000).toFixed(3);
      statsText.textContent = `Showing ${filtered.length} fix${filtered.length === 1 ? '' : 'es'} (${elapsed}s)`;

      if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="empty-state">No fixes matched <strong>${query}</strong>. Try another keyword, command, or tag.</div>`;
        return;
      }

      resultsContainer.innerHTML = filtered.map(fix => {
        const tagsHtml = fix.tags.map(tag =>
          `<span class="tag" onclick="event.stopPropagation(); filterByTag('${tag.replace(/'/g, "\\'")}')">#${tag}</span>`
        ).join('');

        return `
          <div class="card" onclick="openFix('${fix.slug}')">
            <div class="card-url">worksonmymachine › fixes › ${fix.slug}</div>
            <a class="card-title" href="#${fix.slug}" onclick="event.preventDefault(); event.stopPropagation(); openFix('${fix.slug}');">
              ${fix.title}
            </a>
            <p class="card-snippet">${buildSnippet(fix.plainText, query.trim())}</p>
            <div class="tags">${tagsHtml}</div>
          </div>
        `;
      }).join('');
    }

    function openFix(slug) {
      const fix = allFixes.find(f => f.slug === slug);
      if (!fix) return;

      window.location.hash = slug;
      listView.style.display = 'none';
      articleView.style.display = 'block';

      const tagsHtml = fix.tags.length
        ? `<div class="tags" style="margin-bottom:18px;">${fix.tags.map(t => `<span class="tag" onclick="filterByTag('${t.replace(/'/g, "\\'")}')">#${t}</span>`).join('')}</div>`
        : '';

      articleContent.innerHTML = `
        <h1>${fix.title}</h1>
        ${tagsHtml}
        ${renderMarkdown(fix.body)}
      `;
      window.scrollTo(0, 0);
    }

    function closeFix() {
      history.replaceState(null, '', window.location.pathname);
      articleView.style.display = 'none';
      listView.style.display = 'block';
    }

    function filterByTag(tag) {
      searchInput.value = tag;
      closeFix();
      renderResults(tag);
    }

    async function init() {
      try {
        const res = await fetch(MANIFEST_URL);
        if (!res.ok) throw new Error('Could not load manifest.json');
        const filenames = await res.json();

        const loaded = await Promise.all(
          filenames.map(async file => {
            const mdRes = await fetch(FIXES_DIR + file);
            if (!mdRes.ok) return null;
            const text = await mdRes.text();
            return parseMarkdownFile(file, text);
          })
        );

        allFixes = loaded.filter(Boolean);
        renderResults();

        if (window.location.hash) {
          openFix(window.location.hash.slice(1));
        }
      } catch (err) {
        statsText.textContent = 'Error loading fixes. Make sure manifest.json exists.';
        console.error(err);
      }
    }

    searchInput.addEventListener('input', e => {
      if (articleView.style.display === 'block') closeFix();
      renderResults(e.target.value);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      renderResults('');
      searchInput.focus();
    });

    document.getElementById('backBtn').addEventListener('click', closeFix);
    document.getElementById('allBtn').addEventListener('click', () => {
      searchInput.value = '';
      closeFix();
      renderResults('');
    });

    document.getElementById('logoBtn').addEventListener('click', () => {
      searchInput.value = '';
      closeFix();
      renderResults('');
    });

    document.getElementById('luckyBtn').addEventListener('click', () => {
      if (allFixes.length === 0) return;
      const randomFix = allFixes[Math.floor(Math.random() * allFixes.length)];
      openFix(randomFix.slug);
    });

    window.addEventListener('hashchange', () => {
      const slug = window.location.hash.slice(1);
      if (slug) openFix(slug);
      else closeFix();
    });

    init();
  </script>
</body>
</html>
