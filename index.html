<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>worksOnMyMachine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      /* Dracula Surface + Saturated Google Accent Colors */
      --bg: #282a36;
      --bg-elevated: #21222c;
      --card-bg: #313442;
      --card-hover: #363948;
      --border: #44475a;
      --fg: #f8f8f2;
      --muted: #9aa5b8;
      --g-blue: #4285f4;
      --g-red: #ea4335;
      --g-yellow: #fbbc05;
      --g-green: #34a853;
      --link: #6ea8fe;
      --purple: #bd93f9;
      --orange: #ffb86c;
      --code-bg: #1c1d26;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.65;
      min-height: 100vh;
    }

    /* Header & Saturated Google-Style Parody Logo */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 16px 24px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 700;
      letter-spacing: 0.4px;
      margin: 0 0 18px;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .g-blue   { color: var(--g-blue); }
    .g-red    { color: var(--g-red); }
    .g-yellow { color: var(--g-yellow); }
    .g-green  { color: var(--g-green); }

    .search-box {
      width: 100%;
      max-width: 620px;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 11px 18px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box:hover,
    .search-box:focus-within {
      border-color: var(--g-blue);
      box-shadow: 0 0 14px rgba(66, 133, 244, 0.25);
    }

    .search-box input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--fg);
      font-family: inherit;
      font-size: 15.5px;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 17px;
      cursor: pointer;
      display: none;
      padding: 0 4px;
    }

    .clear-btn:hover {
      color: var(--g-red);
    }

    .actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .actions button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .actions button:hover {
      background: var(--card-hover);
      border-color: var(--g-blue);
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.2);
    }

    /* Main Container */
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 22px 16px 64px;
    }

    .stats {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* Cards with Subtle Glow (No Movement) */
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--g-blue);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .card:nth-child(4n+2) { border-left-color: var(--g-red); }
    .card:nth-child(4n+3) { border-left-color: var(--g-yellow); }
    .card:nth-child(4n+4) { border-left-color: var(--g-green); }

    .card:hover {
      background: var(--card-hover);
      border-color: rgba(110, 168, 254, 0.65);
      box-shadow: 0 0 18px rgba(66, 133, 244, 0.16);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--link);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 6px;
    }

    .card:hover .card-title {
      text-decoration: underline;
    }

    .card-snippet {
      font-size: 14.5px;
      color: var(--fg);
      margin: 0 0 12px;
      overflow-wrap: break-word;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      background: var(--bg-elevated);
      color: var(--g-green);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .tag:hover {
      border-color: var(--g-yellow);
      box-shadow: 0 0 8px rgba(251, 188, 5, 0.22);
    }

    mark {
      background: rgba(251, 188, 5, 0.24);
      color: var(--g-yellow);
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* Fix Reader View */
    .article-view {
      display: none;
    }

    .back-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--link);
      font-family: inherit;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      border-color: var(--g-blue);
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.2);
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.25);
      overflow-wrap: break-word;
    }

    .article-content h1,
    .article-content h2,
    .article-content h3 {
      margin-top: 1.4em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    .article-content h1:first-child {
      margin-top: 0;
      font-size: 25px;
      color: var(--fg);
    }

    .article-content h2 {
      font-size: 19px;
      color: var(--link);
    }

    .article-content h3 {
      font-size: 16px;
      color: var(--purple);
    }

    .article-content p,
    .article-content li {
      color: var(--fg);
      font-size: 15px;
      margin-bottom: 10px;
    }

    .article-content ol,
    .article-content ul {
      padding-left: 22px;
    }

    .article-content strong {
      color: #ffffff;
      font-weight: 600;
    }

    .article-content em {
      color: var(--g-yellow);
    }

    .article-content a {
      color: var(--link);
    }

    .article-content pre {
      background: var(--code-bg);
      padding: 14px 16px;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid var(--border);
      margin: 14px 0;
    }

    .article-content code {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      color: var(--orange);
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .article-content pre code {
      padding: 0;
      background: transparent;
      color: var(--fg);
    }

    .empty-state {
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1 class="logo" id="logoBtn" title="Reset search">
      <span class="g-blue">w</span><span class="g-red">o</span><span class="g-yellow">r</span><span class="g-blue">k</span><span class="g-green">s</span><span class="g-red">O</span><span class="g-yellow">n</span><span class="g-blue">M</span><span class="g-green">y</span><span class="g-red">M</span><span class="g-yellow">a</span><span class="g-blue">c</span><span class="g-green">h</span><span class="g-red">i</span><span class="g-yellow">n</span><span class="g-green">e</span>
    </h1>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search Windows fixes, error codes, commands..."
        autocomplete="off"
      />
      <button class="clear-btn" id="clearBtn" title="Clear">✕</button>
    </div>

    <div class="actions">
      <button id="luckyBtn">🎲 I'm Feeling Lucky</button>
      <button id="allBtn">📋 Show All Fixes</button>
    </div>
  </header>

  <main>
    <section id="listView">
      <div class="stats" id="statsText">Loading fixes...</div>
      <div id="resultsContainer" class="results-grid"></div>
    </section>

    <section id="articleView" class="article-view">
      <button class="back-btn" id="backBtn">← Back to results</button>
      <div class="article-card">
        <article id="articleContent" class="article-content"></article>
      </div>
    </section>
  </main>

  <script>
    const FIXES_DIR = 'fixes/';
    const MANIFEST_URL = 'manifest.json';

    let allFixes = [];

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const statsText = document.getElementById('statsText');
    const resultsContainer = document.getElementById('resultsContainer');
    const listView = document.getElementById('listView');
    const articleView = document.getElementById('articleView');
    const articleContent = document.getElementById('articleContent');

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Strip YAML frontmatter even with \r\n or accidental blank lines
    function stripFrontmatter(text) {
      let title = null;
      let tags = [];
      let body = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trimStart();

      const fmMatch = body.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
      if (fmMatch) {
        const meta = fmMatch[1];
        body = (fmMatch[2] || '').trim();

        const titleMatch = meta.match(/^title:\s*(.+)$/m);
        if (titleMatch) title = titleMatch[1].trim().replace(/^["']|["']$/g, '');

        const tagsMatch = meta.match(/^tags:\s*(.+)$/m);
        if (tagsMatch) {
          tags = tagsMatch[1].split(',').map(t => t.trim()).filter(Boolean);
        }
      }

      // Clean accidental leading indentation on non-code lines so Markdown doesn't treat them as code blocks
      body = body.replace(/^[ \t]+(?=\S)/gm, '');

      return { title, tags, body };
    }

    function parseMarkdownFile(filename, rawText) {
      const { title: fmTitle, tags, body } = stripFrontmatter(rawText);
      let title = fmTitle;

      if (!title) {
        const h1Match = body.match(/^#\s+(.+)$/m);
        title = h1Match
          ? h1Match[1].trim()
          : filename.replace(/\.md$/i, '').replace(/[-_]+/g, ' ');
      }

      const plainText = body
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/[#>*_`~\-\[\]()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      return {
        slug: filename.replace(/\.md$/i, ''),
        filename,
        title,
        tags,
        body,
        plainText
      };
    }

    // Inline formatter used by fallback parser
    function formatInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      return out;
    }

    // Fallback Markdown renderer if external marked.js doesn't load
    function fallbackMarkdown(mdText) {
      const lines = mdText.split('\n');
      let html = '';
      let inCodeBlock = false;
      let codeBuffer = [];
      let listType = null; // 'ul' or 'ol'

      function closeList() {
        if (listType) {
          html += listType === 'ul' ? '</ul>' : '</ol>';
          listType = null;
        }
      }

      for (const line of lines) {
        if (line.trim().startsWith('```')) {
          closeList();
          if (!inCodeBlock) {
            inCodeBlock = true;
            codeBuffer = [];
          } else {
            html += `<pre><code>${escapeHtml(codeBuffer.join('\n'))}</code></pre>`;
            inCodeBlock = false;
          }
          continue;
        }

        if (inCodeBlock) {
          codeBuffer.push(line);
          continue;
        }

        const trimmed = line.trim();
        if (!trimmed) {
          closeList();
          continue;
        }

        const h3 = trimmed.match(/^###\s+(.+)/);
        if (h3) { closeList(); html += `<h3>${formatInline(h3[1])}</h3>`; continue; }

        const h2 = trimmed.match(/^##\s+(.+)/);
        if (h2) { closeList(); html += `<h2>${formatInline(h2[1])}</h2>`; continue; }

        const h1 = trimmed.match(/^#\s+(.+)/);
        if (h1) { closeList(); html += `<h1>${formatInline(h1[1])}</h1>`; continue; }

        const ol = trimmed.match(/^\d+\.\s+(.+)/);
        if (ol) {
          if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
          html += `<li>${formatInline(ol[1])}</li>`;
          continue;
        }

        const ul = trimmed.match(/^[-*]\s+(.+)/);
        if (ul) {
          if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
          html += `<li>${formatInline(ul[1])}</li>`;
          continue;
        }

        closeList();
        html += `<p>${formatInline(trimmed)}</p>`;
      }

      closeList();
      return html;
    }

    function renderMarkdown(mdText) {
      if (window.marked && typeof window.marked.parse === 'function') {
        return window.marked.parse(mdText);
      }
      return fallbackMarkdown(mdText);
    }

    function buildSnippet(plainText, query) {
      if (!plainText) return '';
      if (!query) {
        return escapeHtml(plainText.slice(0, 165)) + (plainText.length > 165 ? '...' : '');
      }
      const lowerText = plainText.toLowerCase();
      const idx = lowerText.indexOf(query.toLowerCase());
      let start = idx > 50 ? idx - 50 : 0;
      let rawSnippet = plainText.slice(start, start + 175);
      if (start > 0) rawSnippet = '...' + rawSnippet;
      if (start + 175 < plainText.length) rawSnippet += '...';

      const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return escapeHtml(rawSnippet).replace(
        new RegExp(`(${escapedQuery})`, 'gi'),
        '<mark>$1</mark>'
      );
    }

    function renderResults(query = '') {
      const q = query.trim().toLowerCase();
      clearBtn.style.display = q ? 'block' : 'none';

      const startTime = performance.now();
      const filtered = q
        ? allFixes.filter(fix =>
            fix.title.toLowerCase().includes(q) ||
            fix.plainText.toLowerCase().includes(q) ||
            fix.tags.some(t => t.toLowerCase().includes(q))
          )
        : allFixes;

      const elapsed = ((performance.now() - startTime) / 1000).toFixed(3);
      statsText.textContent = `${filtered.length} fix${filtered.length === 1 ? '' : 'es'} (${elapsed}s)`;

      if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="empty-state">No fixes matched <strong>${escapeHtml(query)}</strong>.</div>`;
        return;
      }

      resultsContainer.innerHTML = filtered.map(fix => {
        const tagsHtml = fix.tags.map(tag =>
          `<span class="tag" onclick="event.stopPropagation(); filterByTag('${tag.replace(/'/g, "\\'")}')">#${escapeHtml(tag)}</span>`
        ).join('');

        return `
          <div class="card" onclick="openFix('${fix.slug}')">
            <a class="card-title" href="#${fix.slug}" onclick="event.preventDefault(); event.stopPropagation(); openFix('${fix.slug}');">
              ${escapeHtml(fix.title)}
            </a>
            <p class="card-snippet">${buildSnippet(fix.plainText, query.trim())}</p>
            <div class="tags">${tagsHtml}</div>
          </div>
        `;
      }).join('');
    }

    function openFix(slug) {
      const fix = allFixes.find(f => f.slug === slug);
      if (!fix) return;

      window.location.hash = slug;
      listView.style.display = 'none';
      articleView.style.display = 'block';

      const tagsHtml = fix.tags.length
        ? `<div class="tags" style="margin-bottom:18px;">${fix.tags.map(t => `<span class="tag" onclick="filterByTag('${t.replace(/'/g, "\\'")}')">#${escapeHtml(t)}</span>`).join('')}</div>`
        : '';

      articleContent.innerHTML = `
        <h1>${escapeHtml(fix.title)}</h1>
        ${tagsHtml}
        ${renderMarkdown(fix.body)}
      `;
      window.scrollTo(0, 0);
    }

    function closeFix() {
      history.replaceState(null, '', window.location.pathname);
      articleView.style.display = 'none';
      listView.style.display = 'block';
    }

    function filterByTag(tag) {
      searchInput.value = tag;
      closeFix();
      renderResults(tag);
    }

    async function init() {
      try {
        const res = await fetch(MANIFEST_URL);
        if (!res.ok) throw new Error('Could not load manifest.json');
        const filenames = await res.json();

        const loaded = await Promise.all(
          filenames.map(async file => {
            const mdRes = await fetch(FIXES_DIR + file);
            if (!mdRes.ok) return null;
            const text = await mdRes.text();
            return parseMarkdownFile(file, text);
          })
        );

        allFixes = loaded.filter(Boolean);
        renderResults();

        if (window.location.hash) {
          openFix(window.location.hash.slice(1));
        }
      } catch (err) {
        statsText.textContent = 'Error loading fixes. Make sure manifest.json exists.';
        console.error(err);
      }
    }

    searchInput.addEventListener('input', e => {
      if (articleView.style.display === 'block') closeFix();
      renderResults(e.target.value);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      renderResults('');
      searchInput.focus();
    });

    document.getElementById('backBtn').addEventListener('click', closeFix);
    document.getElementById('allBtn').addEventListener('click', () => {
      searchInput.value = '';
      closeFix();
      renderResults('');
    });

    document.getElementById('logoBtn').addEventListener('click', () => {
      searchInput.value = '';
      closeFix();
      renderResults('');
    });

    document.getElementById('luckyBtn').addEventListener('click', () => {
      if (allFixes.length === 0) return;
      const randomFix = allFixes[Math.floor(Math.random() * allFixes.length)];
      openFix(randomFix.slug);
    });

    window.addEventListener('hashchange', () => {
      const slug = window.location.hash.slice(1);
      if (slug) openFix(slug);
      else closeFix();
    });

    init();
  </script>
</body>
</html>
